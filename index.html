<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather App</title>
        <link rel="stylesheet" href="style.css" />
      </head>
      <body>
        <div class="weather-card">
          <div class="inputArea">
            <input type="text" placeholder="Enter city name" id="inputData" />
            <button id="searchBtn">Click</button>
          </div>
          <!-- <img src="Assests/sunny.png" alt="" /> -->
          <div class="top">
            <h2 id="city">Islamabad</h2>
            <p id="time">Thursday, 11 June</p>
          </div>

          <div class="main-weather">
            <div>
              <img src="Assests/sunny.png" alt="" id="icon" />
            </div>
            <h1 id="temp">32°</h1>
            <p id="condition">Sunny</p>
          </div>

          <div class="details">
            <div class="box">
              <h3>Humidity</h3>
              <p id="Humidity">65%</p>
            </div>

            <div class="box">
              <h3>Wind</h3>
              <p id="wind">12 km/h</p>
            </div>

            <div class="box">
              <h3>Pressure</h3>
              <p id="Pressure">1013 hPa</p>
            </div>

            <div class="box">
              <h3>Feels Like</h3>
              <p id="feelsLike">35°</p>
            </div>
          </div>

          <!-- <div class="forecast">
            <div class="day">
              <span>Fri</span>
              <span>☀️</span>
              <span>34°</span>
            </div>

            <div class="day">
              <span>Sat</span>
              <span>⛅</span>
              <span>30°</span>
            </div>

            <div class="day">
              <span>Sun</span>
              <span>🌧️</span>
              <span>28°</span>
            </div>

            <div class="day">
              <span>Mon</span>
              <span>☀️</span>
              <span>33°</span>
            </div>
          </div> -->
        </div>
      </body>
    </html>
    <script src="script.js"></script>
  </body>
</html>
